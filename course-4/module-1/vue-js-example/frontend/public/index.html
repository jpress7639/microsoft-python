<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>My Book App</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        h2{
            color: blue;
        }
    </style>
  </head>
  <body>
    <div id="app">
        <my-component></my-component>
        {{message}}
    </div>
    <!-- built files will be auto injected -->
     <script>
        const app = Vue.createApp({ data() { return { message: 'Hello from Vue!' }; } }); 

        app.component('my-component', {
            template: `<div><h1>Flask Instantiations</h1></div>`, 
            data(){ return {books: [] }; },
            mounted(){ fetch('http://127.0.0.1:5000/api/books').then(response => console.log(response.json())).then(data => { this.books = data; });
            // the JSON data is now stored in this.books
            } });app.mount('#app');
     </script>
  </body>
</html>
